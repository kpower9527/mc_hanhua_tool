[project]
name = "mctrans"
version = "0.1.0"
description = "Minecraft 整合包自动汉化工具"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "openai>=1.40",
    "rich>=13",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.scripts]
mctrans = "mctrans.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mctrans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
